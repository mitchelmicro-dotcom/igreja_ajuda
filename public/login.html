


<html>
  <head>
    <meta charset="utf-8" />
    <title>App Help Desk</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <style>
      .card-login {
        padding: 30px 0 0 0;
        width: 350px;
        margin: 0 auto;
      }
    </style>

      
  </head>

  <body>

    <nav class="navbar navbar-dark bg-dark">
      <a class="navbar-brand" href="#">
        <img src="../imagens/logo3.png" width="35" height="30" class="d-inline-block align-center" alt="">
        Painel de Controle - Igreja Ajuda
      </a>
    </nav>

    <div class="container">    
      <div class="row">

        <div class="card-login">
          <div class="card"> 
            <div class="card-header">
              Login Administrativo
            </div>
            <div class="card-body">
              <form action="/valida_login" method="POST">
                <div class="form-group">
                  <input name="email" type="email" class="form-control" placeholder="E-mail">
                </div>
                <div class="form-group">
                  <input name="senha" type="password" class="form-control" placeholder="Senha">
                </div>

                <div id="msg-erro1" class="text-danger d-none mb-2">
                  Usuário ou senha inválidos. Tente novamente.
                </div>

                <div id="msg-erro2" class="text-danger d-none mb-2">
                  Faça login antes de acessar as páginas protegidas.
                </div>

                <button class="btn btn-lg btn-primary btn-block" type="submit">Entrar</button>
              </form>
            </div>
          </div>
        </div>
    </div>

    <script>
      // Lê o que está na URL do navegador para mostrar mensagens de erro
      const urlParams = new URLSearchParams(window.location.search);
      const parametroLogin = urlParams.get('login');

      // Se a URL tiver ?login=erro, mostra a mensagem 1
      if (parametroLogin === 'erro') {
        document.getElementById('msg-erro1').classList.remove('d-none');
      }
      // Se a URL tiver ?login=erro2, mostra a mensagem 2
      else if (parametroLogin === 'erro2') {
        document.getElementById('msg-erro2').classList.remove('d-none');
      }

    </script>
